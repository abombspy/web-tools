name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # sharp의 wasm32 폴백(@emnapi/*)이 로컬 npm(11.x)과 CI 기본 npm 버전 간
      # optionalDependencies 잠금 판정이 달라 "npm ci"가 CI에서만 실패했다
      # (로컬에서는 재현 안 됨) — npm install로 완화.
      - run: npm install
      - run: npm run lint
      - run: npm run test
      - run: npm run build
        env:
          # 커스텀 도메인 연결 전 임시 주소(abombspy.github.io/web-tools)용
          # 서브패스. 커스텀 도메인 연결 후에는 이 줄을 지우면 루트로 배포된다.
          GITHUB_PAGES_BASE_PATH: /web-tools
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
